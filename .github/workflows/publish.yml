name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Check wrapper checksum
        run: cd gradle/wrapper && sha256sum -c gradle-wrapper.jar.sha256
      - name: Test app review tool
        run: python3 -m unittest discover -s tools/tests -v
      - name: Build and test
        run: ./gradlew --no-daemon check assemble :core:sourcesJar :android:sourcesJar publishAllPublicationsToLocalTestRepository
      - name: Test independent consumer
        run: ./gradlew --no-daemon -p examples/consumer run
      - name: Test checkout integration
        run: ./gradlew --no-daemon -p examples/consumer -PuseCheckout=true run
      - name: Validate tag and artifacts
        run: python3 tools/release.py "$GITHUB_REF_NAME"
      - name: Publish libraries to GitHub Packages
        run: ./gradlew --no-daemon publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" core/build/libs/*.jar android/build/libs/*.jar build/release-SHA256SUMS.txt --verify-tag --title "Apoio Apps $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
