name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Check wrapper checksum
        run: cd gradle/wrapper && sha256sum -c gradle-wrapper.jar.sha256
      - name: Build, test and publish to local Maven fixture
        run: ./gradlew --no-daemon check assemble :core:sourcesJar :android:sourcesJar publishAllPublicationsToLocalTestRepository
      - name: Test an independent Maven consumer
        run: ./gradlew --no-daemon -p examples/consumer run
      - name: Test checkout integration
        run: ./gradlew --no-daemon -p examples/consumer -PuseCheckout=true run
      - name: Check whitespace
        run: git show --format= --check HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apoio-apps-${{ github.sha }}
          path: |
            core/build/libs/*.jar
            android/build/libs/*.jar
            android/build/reports/tests/test/
          if-no-files-found: error
